name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t production-app ./app
        - name: Test application files
        run: |
          test -f app/index.html
          test -f app/Dockerfile
